<!doctype html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putni Doživljaji – put od A do B</title>
<meta name="description" content="Putuješ od A do B? Pronađi šta vrijedi doživjeti usput: hrana, vidikovci, priroda, kultura i istorija.">
<meta name="theme-color" content="#0b7a55">
<link rel="manifest" href="manifest.json"><link rel="icon" href="img/icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--g:#0b7a55;--tx:#16221d;--mu:#6b7a73;--bd:#e3e9e5;--bg:#f4f8f6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);max-width:480px;margin:auto;background:#fff}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
.s{display:none;min-height:100dvh}.s.on{display:block}
#home{background:linear-gradient(#0005,#000b),url(img/hero.jpg) center/cover;color:#fff;padding:calc(env(safe-area-inset-top) + 24px) 20px 28px;flex-direction:column;justify-content:space-between}
#home.on{display:flex}
.logo{font-weight:700;font-size:20px}
#home h1{font-size:30px;line-height:1.2;margin-top:28px}
.cta{display:flex;align-items:center;gap:12px;width:100%;background:#fff;color:var(--tx);border-radius:18px;padding:16px;text-align:left}
.cta b{display:block;font-size:17px}.cta small{color:var(--mu)}.cta span:first-child{font-size:26px}.cta span:last-child{margin-left:auto;font-size:22px}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;font-weight:700;font-size:17px}
.top button{font-size:22px;width:36px;height:36px}
.pad{padding:0 18px 100px}
h3{font-size:15px;margin:20px 0 8px}
.f{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin-bottom:10px}
.f label{font-size:11px;color:var(--mu);display:block}.f input{border:0;outline:0;width:100%;background:none;padding:2px 0}
.f div{flex:1}.f button{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;background:#fff}
.ch.on{background:var(--g);color:#fff;border-color:var(--g)}
.chips.cat .ch.on{color:var(--tx);border-color:var(--c);background:var(--bgc);font-weight:600}
.btn{display:block;width:100%;background:var(--g);color:#fff;border-radius:14px;padding:15px;font-weight:600;text-align:center;text-decoration:none}
.btn.l{background:var(--bg);color:var(--tx)}
.fix{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);background:#fff;box-shadow:0 -4px 16px #0001;z-index:500}
.err{color:#b3261e;margin-top:12px;font-size:14px}
#map{height:36dvh;width:100%;background:#dfe9e4}
.panel{border-radius:20px 20px 0 0;margin-top:-18px;position:relative;z-index:400;background:#fff;padding:16px 18px 130px}
.stats{display:flex;gap:10px;margin:12px 0}.stats div{flex:1;background:var(--bg);border-radius:12px;padding:10px}.stats b{font-size:17px;display:block}.stats small{color:var(--mu);font-size:12px}
.card{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:8px;margin-bottom:10px}
.card .b{flex:1;min-width:0;text-align:left}.card .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:var(--mu);font-size:12.5px;display:block}
.ph{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:11.5px;border-radius:8px;padding:2px 8px;margin-bottom:2px}
.add{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--g);color:var(--g);font-size:20px;flex:none}
.add.on{background:var(--g);color:#fff}
.tl{position:relative;margin-left:10px;border-left:2px solid var(--bd);padding-left:22px}
.tl .it{position:relative;padding:0 0 18px}
.tl .it i{position:absolute;left:-33px;top:0;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font:600 11px/20px system-ui;text-align:center}
.tl .it small{color:var(--mu)}.tl .t{float:right;color:var(--mu);font-size:13px}
#sh{position:fixed;inset:0;background:#0006;z-index:1000;display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}
#shc{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:88dvh;overflow:auto;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px)}
#shc .ph{width:100%;height:170px;border-radius:14px;font-size:54px;margin-bottom:12px}
#shc .btn{margin-top:10px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;border:2px solid #fff;font:700 13px/22px system-ui;text-align:center;box-shadow:0 1px 4px #0005}
.dot.o{width:12px;height:12px;background:#8a9a92;box-shadow:none}
.ld{text-align:center;padding:40px 0;color:var(--mu)}
</style></head><body>

<section class="s on" id="home">
 <div><div class="logo">📍 Putni Doživljaji</div>
 <h1>Putujem od A do B.<br>Pronađi mi šta vrijedi doživjeti usput.</h1></div>
 <button class="cta" onclick="go('form')"><span>🧭</span><span><b>Planiraj put</b><small>Otkrij najbolje stanice na svojoj ruti</small></span><span>›</span></button>
</section>

<section class="s" id="form">
 <div class="top"><button onclick="go('home')" aria-label="Nazad">←</button>Planiraj put</div>
 <div class="pad">
  <h3 style="margin-top:4px">Ruta</h3>
  <div class="f"><span>🟢</span><div><label for="fa">Polazište</label><input id="fa" list="la" placeholder="npr. Sarajevo" autocomplete="off"></div><button onclick="gps()" aria-label="Moja lokacija">⌖</button></div>
  <div class="f"><span>📍</span><div><label for="fb">Odredište</label><input id="fb" list="lb" placeholder="npr. Mostar" autocomplete="off"></div></div>
  <datalist id="la"></datalist><datalist id="lb"></datalist>
  <h3>Prevoz</h3><div class="chips" id="cm"></div>
  <h3>Polazak</h3><div class="f" style="width:140px"><input type="time" id="t0" value="08:00"></div>
  <h3>Koliko dodatnog vremena imaš po stanici?</h3><div class="chips" id="ce"></div>
  <h3>Šta želiš da doživiš?</h3><div class="chips cat" id="ci"></div>
  <div class="err" id="err"></div>
 </div>
 <div class="fix"><button class="btn" id="go" onclick="plan()">Pronađi najbolje opcije →</button></div>
</section>

<section class="s" id="res">
 <div class="top" style="position:absolute;z-index:600;padding-bottom:0"><button onclick="go('form')" style="background:#fff;border-radius:50%;box-shadow:0 1px 6px #0004" aria-label="Nazad">←</button></div>
 <div id="map"></div>
 <div class="panel" id="pn"></div>
 <div class="fix"><a class="btn" id="nav" target="_blank" rel="noopener">➤ Pokreni navigaciju</a></div>
</section>

<div id="sh" onclick="if(event.target==this)this.classList.remove('on')"><div id="shc"></div></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s),API=window.BLIZU_API||"",R=Math.PI/180;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODES={car:{n:"🚗 Auto",spd:40,gm:"driving"},bike:{n:"🚲 Bicikl",spd:15,gm:"bicycling"},foot:{n:"🚶 Pješice",spd:4.5,gm:"walking"}};
const CATS={hrana:{n:"Lokalna hrana",ic:"🍴",c:"#e8890c",bg:"#fff1dc",q:["jesti"],v:60},vid:{n:"Vidikovci",ic:"⛰️",c:"#1d78c9",bg:"#e1f0fc",q:["videti"],v:20},pri:{n:"Priroda",ic:"🌿",c:"#2a9d57",bg:"#e0f5e8",q:["odmoriti"],v:45},kul:{n:"Kultura",ic:"🏛️",c:"#7b4bc4",bg:"#efe6fb",q:["videti","dogadjaji"],v:45},ist:{n:"Istorija",ic:"🏰",c:"#d6455a",bg:"#fde4e8",q:["videti"],v:40}};
let mode="car",extra=20,want=new Set(["hrana","vid","pri"]),A,B,base,cm=new Map(),sel=new Set(),opts=[],rt,map,layer,S={};

function go(id){document.querySelectorAll(".s").forEach(e=>e.classList.toggle("on",e.id==id));scrollTo(0,0);if(id=="res"&&map)setTimeout(()=>map.invalidateSize(),50)}
function chips(el,items,isOn,fn,cls){el.innerHTML=items.map(([k,l])=>`<button class="ch ${isOn(k)?"on":""}" data-k="${k}" ${cls?`style="--c:${CATS[k].c};--bgc:${CATS[k].bg}"`:""}>${l}</button>`).join("");el.onclick=e=>{const b=e.target.closest("button");if(b){fn(b.dataset.k);chips(el,items,isOn,fn,cls)}}}
chips($("#cm"),Object.entries(MODES).map(([k,v])=>[k,v.n]),k=>k==mode,k=>mode=k);
chips($("#ce"),[10,20,30,45,60].map(m=>[m,m+" min"]),k=>k==extra,k=>extra=+k);
chips($("#ci"),Object.entries(CATS).map(([k,v])=>[k,v.ic+" "+v.n]),k=>want.has(k),k=>want.has(k)?want.delete(k):want.add(k),1);

// ---------- adrese ----------
async function geo(q){const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=sr-Latn&q="+encodeURIComponent(q));if(!r.ok)throw Error("Traženje adrese trenutno ne radi");return(await r.json()).map(x=>({name:x.display_name.split(",")[0],full:x.display_name.split(",").slice(0,3).join(","),lat:+x.lat,lon:+x.lon}))}
[["fa","la"],["fb","lb"]].forEach(([i,l])=>{const inp=$("#"+i);let tm;inp.addEventListener("input",()=>{inp._o=null;clearTimeout(tm);const v=inp.value.trim();if(v.length<3)return;tm=setTimeout(async()=>{try{const r=await geo(v);inp._s={};r.forEach(x=>inp._s[x.full]=x);$("#"+l).innerHTML=r.map(x=>`<option value="${esc(x.full)}">`).join("")}catch(e){}},600)})});
function gps(){navigator.geolocation?.getCurrentPosition(p=>{const i=$("#fa");i.value="Moja lokacija";i._o={name:"Moja lokacija",lat:p.coords.latitude,lon:p.coords.longitude}},()=>$("#err").textContent="Lokacija nije dozvoljena.")}
async function resolve(i){const v=i.value.trim();if(!v)throw Error("Unesi polazište i odredište.");if(i._o&&i._o.name=="Moja lokacija"&&v=="Moja lokacija")return i._o;if(i._s&&i._s[v])return i._s[v];const r=await geo(v);if(!r[0])throw Error("Ne mogu pronaći: "+v);return r[0]}

// ---------- rute ----------
function dk(a,b){return 6371*Math.hypot((b[1]-a[1])*R*Math.cos((a[0]+b[0])*R/2),(b[0]-a[0])*R)}
async function route(pts){const p=mode=="car"?"car":mode;const u=`https://routing.openstreetmap.de/routed-${p}/route/v1/driving/${pts.map(x=>x[1].toFixed(5)+","+x[0].toFixed(5)).join(";")}?overview=full&geometries=geojson`;const r=await fetch(u);if(!r.ok)throw Error("Servis za rute trenutno ne radi");const j=await r.json();if(!j.routes?.length)throw Error("Ruta između ove dvije tačke nije pronađena");const o=j.routes[0];return{line:o.geometry.coordinates.map(c=>[c[1],c[0]]),dur:o.duration,dist:o.distance,legs:o.legs.map(l=>l.duration)}}
const cls=t=>t.tourism=="viewpoint"?"vid":t.historic?"ist":/^(museum|gallery)$/.test(t.tourism)||/^(theatre|arts_centre)$/.test(t.amenity)||t.tourism=="attraction"?"kul":t.natural||/^(beach_resort|park|marina)$/.test(t.leisure)?"pri":/^(restaurant|cafe)$/.test(t.amenity)?"hrana":null;
const fmt=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"min":m+" min"};
const hhmm=m=>{m=Math.round(m)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

const OVP=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const QF={
  jesti: 'nwr@[amenity~"^(restaurant|cafe|bar|pub|fast_food|ice_cream)$"][name];',
  videti: 'nwr@[tourism~"^(attraction|viewpoint|museum|gallery)$"][name];nwr@[historic~"^(castle|fort|monument|ruins|archaeological_site|memorial)$"][name];',
  odmoriti: 'nwr@[natural=beach];nwr@[leisure~"^(beach_resort|park|marina)$"][name];',
  dogadjaji: 'nwr@[amenity~"^(theatre|cinema|arts_centre|nightclub)$"][name];',
};
let why="";
const first=ps=>new Promise(res=>{let n=ps.length;ps.forEach(p=>p.then(v=>{v?res(v):--n||res(null)},()=>--n||res(null)))});
function ovp(u,q){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),15000);return fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ac.signal}).then(r=>r.ok?r.json():null).then(j=>j&&j.elements&&!(j.remark&&/error|timed out|out of memory|rate|too many/i.test(j.remark))?j.elements:null).finally(()=>clearTimeout(t))}
// Worker prvi (brz, iz KV-a); ako ne odgovori, javni Overpass serveri direktno (kao u staroj aplikaciji); rezultat se kešira 6 h
async function point(lat,lng,r,cats){
 const ck="pd_"+lat.toFixed(2)+"_"+lng.toFixed(2)+"_"+r+"_"+cats.join();
 try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c&&Date.now()-c.t<216e5)return c.e}catch(e){}
 const w=await Promise.all(cats.map(c=>fetch(`${API}/api/places?lat=${lat}&lng=${lng}&r=${r}&cat=${c}`,{signal:AbortSignal.timeout(6000)}).then(x=>x.ok?x.json():(why=why||"Worker HTTP "+x.status,null)).catch(e=>(why=why||"Worker: "+e.message,null))));
 let els=null;const ok=w.filter(Boolean);
 if(ok.length)els=ok.flatMap(x=>x.elements||[]);
 else{const A=`(around:${r},${lat},${lng})`,q=`[out:json][timeout:25];(${cats.map(c=>QF[c].replace(/@/g,A)).join("")});out center tags 300;`;els=await first(OVP.map(u=>ovp(u,q)))}
 if(els)try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),e:els}))}catch(e){}
 return els}
async function plan(){
 const err=$("#err"),btn=$("#go");err.textContent="";
 if(!want.size)return err.textContent="Izaberi bar jednu vrstu doživljaja.";
 if(!API)return err.textContent="Nedostaje BLIZU_API u config.js.";
 btn.disabled=true;
 try{
  btn.textContent="Tražim adrese…";A=await resolve($("#fa"));B=await resolve($("#fb"));
  btn.textContent="Računam rutu…";base=await route([[A.lat,A.lon],[B.lat,B.lon]]);
  const line=base.line,cum=[0];for(let i=1;i<line.length;i++)cum[i]=cum[i-1]+dk(line[i-1],line[i]);
  const D=cum.at(-1),spd=MODES[mode].spd,reach=Math.max(.3,extra*spd/162),rk=reach+1.5,n=Math.min(14,Math.max(1,Math.ceil(D/(2*rk)))),r=Math.round(rk*1000);
  const cats=[...new Set([...want].flatMap(k=>CATS[k].q))],pts=[];
  for(let i=0;i<n;i++){const t=(i+.5)*D/n;let j=cum.findIndex(c=>c>=t);if(j<0)j=cum.length-1;pts.push(line[j])}
  btn.textContent="Tražim mjesta duž puta…";
  const res=[];for(let i=0;i<pts.length;i+=3)res.push(...await Promise.all(pts.slice(i,i+3).map(p=>point(+p[0].toFixed(4),+p[1].toFixed(4),r,cats).catch(()=>null))));
  const fails=res.filter(x=>!x).length;
  if(fails==res.length)throw Error("Ne mogu da preuzmem mjesta (ni Worker ni Overpass ne odgovaraju). Pokušaj ponovo za koji minut."+(why?" ["+why+"]":""));
  const els=res.flatMap(x=>x||[]);
  cm=new Map();const names=new Set();
  for(const el of els){const t=el.tags||{};if(!t.name)continue;const c=cls(t);if(!c||!want.has(c))continue;const id=el.type[0]+el.id;if(cm.has(id)||names.has(t.name+c))continue;
   const p=el.type=="node"?[el.lat,el.lon]:el.center?[el.center.lat,el.center.lon]:null;if(!p)continue;
   let d=1e9,bi=0;for(let i=0;i<line.length;i++){const x=dk(p,line[i]);if(x<d){d=x;bi=i}}if(d>reach)continue;
   const est=Math.max(2,Math.round(2*d*1.35/spd*60)),nt=(t.wikidata?2:0)+(t.wikimedia_commons||t.image?1.5:0)+(t.description?.5:0)+(t["name:en"]?.3:0)+(t.tourism=="attraction"?1:0)+(/castle|fort|ruins|archaeological_site/.test(t.historic)?1:0)+(t.amenity=="restaurant"?.5:0)+(t.cuisine?.5:0);
   names.add(t.name+c);cm.set(id,{id,t,c,p,d,est,f:cum[bi]/D,v:CATS[c].v,sc:nt-est/extra*1.2})}
  const all=[...cm.values()].sort((a,b)=>b.sc-a.sc);
  if(!all.length)throw Error(fails?`Dio zahtjeva nije uspio (${fails}/${res.length}). Pokušaj ponovo za koji minut.`:"Nema pronađenih mjesta na ovoj ruti. Probaj više vremena ili druge interese.");
  const pick=[],cc={};for(const c of all){if(pick.length>=4)break;if((cc[c.c]||0)>=2||pick.some(p=>Math.abs(p.f-c.f)<.08))continue;pick.push(c);cc[c.c]=(cc[c.c]||0)+1}
  sel=new Set(pick.map(c=>c.id));opts=[...new Set([...pick,...all.slice(0,14)])].sort((a,b)=>b.sc-a.sc);
  go("res");if(!map){map=L.map("map",{zoomControl:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);layer=L.layerGroup().addTo(map)}
  await refresh(1);
 }catch(e){err.textContent=e.message||"Nešto nije u redu. Pokušaj ponovo."}
 btn.disabled=false;btn.textContent="Pronađi najbolje opcije →";
}

async function refresh(fit){
 const st=[...sel].map(i=>cm.get(i)).sort((a,b)=>a.f-b.f);S.st=st;
 try{rt=st.length?await route([[A.lat,A.lon],...st.map(s=>s.p),[B.lat,B.lon]]):base}catch(e){rt=base}
 layer.clearLayers();L.polyline(rt.line,{color:"#0b7a55",weight:5}).addTo(layer);
 const ic=(h,s)=>L.divIcon({html:h,className:"",iconSize:s,iconAnchor:[s[0]/2,s[1]/2]});
 L.marker([A.lat,A.lon],{icon:ic('<div class="dot">A</div>',[26,26])}).addTo(layer);L.marker([B.lat,B.lon],{icon:ic('<div class="dot" style="background:#d6455a">B</div>',[26,26])}).addTo(layer);
 opts.filter(o=>!sel.has(o.id)).forEach(o=>L.marker(o.p,{icon:ic('<div class="dot o"></div>',[12,12])}).on("click",()=>opn(o.id)).addTo(layer));
 st.forEach((s,i)=>L.marker(s.p,{icon:ic(`<div class="dot" style="background:${CATS[s.c].c}">${i+1}</div>`,[26,26])}).on("click",()=>opn(s.id)).addTo(layer));
 if(fit)map.fitBounds(L.polyline(rt.line).getBounds(),{padding:[30,30]});
 const vis=st.reduce((a,s)=>a+s.v,0),tot=rt.dur/60+vis,km=rt.dist/1000;
 S.vis=vis;S.tot=tot;
 $("#nav").href=`https://www.google.com/maps/dir/?api=1&origin=${A.lat},${A.lon}&destination=${B.lat},${B.lon}&travelmode=${MODES[mode].gm}${st.length?"&waypoints="+st.map(s=>s.p.join(",")).join("|"):""}`;
 $("#pn").innerHTML=`<h2 style="font-size:19px">${esc(A.name)} → ${esc(B.name)}</h2>
 <div style="color:var(--mu);font-size:13px">${st.length} stanica · ${km.toFixed(0)} km · polazak ${$("#t0").value}</div>
 <div class="stats"><div><b>${fmt(base.dur/60)}</b><small>vožnja (osnovna ruta)</small></div><div><b>${fmt(tot)}</b><small>ukupno sa stanicama</small></div></div>
 <h3>Tvoj plan putovanja</h3><div class="tl" id="tl"></div>
 <h3>Najbolje opcije duž puta</h3>${opts.map(o=>card(o)).join("")}
 <p style="color:var(--mu);font-size:12px;margin-top:8px">Vremena skretanja su procjena. Podaci: OpenStreetMap. Radno vrijeme provjeri prije dolaska.</p>`;
 tl();
}
function tl(){
 const st=S.st,t0=$("#t0").value.split(":"),s0=+t0[0]*60+ +t0[1];let t=s0,h=`<div class="it"><i>A</i><span class="t">${hhmm(t)}</span><b>${esc(A.name)}</b><br><small>Početak putovanja</small></div>`;
 st.forEach((s,i)=>{t+=rt.legs[i]/60;const a=t;t+=s.v;h+=`<div class="it"><i style="background:${CATS[s.c].c}">${i+1}</i><span class="t">${hhmm(a)}</span><b>${esc(s.t.name)}</b><br><small>${CATS[s.c].n} · ${fmt(s.v)} · ~+${s.est} min</small></div>`});
 t+=rt.legs.at(-1)/60;h+=`<div class="it"><i style="background:#d6455a">B</i><span class="t">${hhmm(t)}</span><b>${esc(B.name)}</b><br><small>Cilj putovanja</small></div>`;$("#tl").innerHTML=h}
function ph(c,big){const t=c.t,w=t.wikimedia_commons;let u=/^https?:/.test(t.image||"")?t.image:null;if(!u&&w&&/^File:/.test(w))u="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(w.slice(5))+"?width="+(big?800:200);const k=CATS[c.c];return`<div class="ph" style="background:${k.bg}">${k.ic}${u?`<img src="${esc(u)}" loading="lazy" onerror="this.remove()">`:""}</div>`}
const chip=c=>`<span class="tag" style="background:${CATS[c].bg};color:${CATS[c].c}">${CATS[c].ic} ${CATS[c].n}</span>`;
function card(o){return`<div class="card">${ph(o)}<button class="b" onclick="opn('${o.id}')"><div class="n">${esc(o.t.name)}</div>${chip(o.c)}<small>+${o.est} min · ${fmt(o.v)} posjeta · ${o.d.toFixed(1)} km od rute</small></button><button class="add ${sel.has(o.id)?"on":""}" onclick="tog('${o.id}')" aria-label="Dodaj u plan">${sel.has(o.id)?"✓":"+"}</button></div>`}
async function tog(id){const y=document.scrollingElement.scrollTop;sel.has(id)?sel.delete(id):sel.add(id);$("#sh").classList.remove("on");await refresh();scrollTo(0,y)}
function opn(id){const o=cm.get(id),t=o.t,x=[t.cuisine&&"Kuhinja: "+t.cuisine.replace(/;/g,", "),t.opening_hours&&"Radno vrijeme: "+t.opening_hours,t.phone||t["contact:phone"]].filter(Boolean);
 $("#shc").innerHTML=`${ph(o,1)}<h2 style="font-size:20px">${esc(t.name)}</h2>${chip(o.c)}
 <div class="stats"><div><b>~+${o.est} min</b><small>dodatno vrijeme</small></div><div><b>${fmt(o.v)}</b><small>trajanje posjete</small></div><div><b>${o.d.toFixed(1)} km</b><small>od rute</small></div></div>
 ${t.description?`<p>${esc(t.description)}</p>`:""}${x.map(l=>`<p style="color:var(--mu);margin-top:6px">${esc(l)}</p>`).join("")}
 <button class="btn" onclick="tog('${id}')">${sel.has(id)?"Ukloni iz plana":"Dodaj u plan"}</button>
 <a class="btn l" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${o.p.join(",")}&travelmode=${MODES[mode].gm}">➤ Navigacija do stanice</a>`;$("#sh").classList.add("on")}
$("#t0").addEventListener("change",()=>{if(rt&&S.st)tl()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
