name: Osvježi bazu mjesta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - name: Preuzmi OSM izvode (Geofabrik)
        run: |
          mkdir -p /tmp/osm && cd /tmp/osm
          for r in bosnia-herzegovina montenegro croatia serbia; do
            curl -fsSL -O "https://download.geofabrik.de/europe/${r}-latest.osm.pbf"
          done
      - name: Napravi ćelije
        run: python3 tools/build-grid.py data/places /tmp/osm/*.osm.pbf
      - name: Sačuvaj promjene
        run: |
          git config user.name "blizu-bot"
          git config user.email "blizu-bot@users.noreply.github.com"
          git add -A data/places
          git diff --cached --quiet || (git commit -m "Baza mjesta: mjesečno osvježavanje" && git push)
